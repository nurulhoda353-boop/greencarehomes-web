name: Deploy to cPanel

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: Deploy to cPanel via FTP
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Build Project
      run: npm run build
      
    - name: Sync files to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: .output/
        # Update server-dir to the specific folder path in your cPanel if needed (e.g. public_html/ or app/)
        server-dir: /
        # We must override exclude because the action excludes node_modules by default, but Nitro places necessary production dependencies in .output/server/node_modules
        exclude: '[]'
